<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">First setup: connect a model, then make a request</title><desc id="desc">Each step prepares the access needed by the next step.；Platform administration does not grant inference access; personal inference requires team membership.</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">First setup: connect a model, then make a request</text>
<text x="28" y="70" font-size="14" fill="#50645a">Each step prepares the access needed by the next step.</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">Connect models</text><text x="46" y="192" font-size="14" fill="#50645a">Provider credential</text><text x="46" y="216" font-size="14" fill="#50645a">Deployment / public name</text><text x="46" y="240" font-size="14" fill="#50645a">Models + Endpoints</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">Set up a workspace</text><text x="290" y="192" font-size="14" fill="#50645a">Organization / team</text><text x="290" y="216" font-size="14" fill="#50645a">Members / models / budget</text><text x="290" y="240" font-size="14" fill="#50645a">Optional project</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">Issue a virtual key</text><text x="534" y="192" font-size="14" fill="#50645a">Personal: experiments</text><text x="534" y="216" font-size="14" fill="#50645a">Service: shared apps</text><text x="534" y="240" font-size="14" fill="#50645a">Inherit and narrow scope</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">Call and inspect</text><text x="778" y="192" font-size="14" fill="#50645a">Playground → application</text><text x="778" y="216" font-size="14" fill="#50645a">Usage: costs and totals</text><text x="778" y="240" font-size="14" fill="#50645a">Logs: individual calls</text>
<text x="28" y="311" font-size="14" fill="#50645a">Platform administration does not grant inference access; personal inference requires team membership.</text>
</g></svg>
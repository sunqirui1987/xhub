<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">路由模板：选择最近的绑定，向上继承</title><desc id="desc">解析顺序为密钥 → 团队 → 组织 → 平台；找到模板后停止查找。；选中的模板整体替换上级模板，字段不合并；项目和账号没有独立的路由模板绑定。</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">路由模板：选择最近的绑定，向上继承</text>
<text x="28" y="70" font-size="14" fill="#50645a">解析顺序为密钥 → 团队 → 组织 → 平台；找到模板后停止查找。</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">密钥</text><text x="46" y="192" font-size="14" fill="#50645a">已绑定？使用该模板</text><text x="46" y="216" font-size="14" fill="#50645a">未绑定？继续向右</text><text x="46" y="240" font-size="14" fill="#50645a">可为应用单独选择</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">团队</text><text x="290" y="192" font-size="14" fill="#50645a">已绑定？使用该模板</text><text x="290" y="216" font-size="14" fill="#50645a">未绑定？继续向右</text><text x="290" y="240" font-size="14" fill="#50645a">团队应用共享选择</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">组织</text><text x="534" y="192" font-size="14" fill="#50645a">已绑定？使用该模板</text><text x="534" y="216" font-size="14" fill="#50645a">未绑定？继续向右</text><text x="534" y="240" font-size="14" fill="#50645a">组织内继承选择</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">平台</text><text x="778" y="192" font-size="14" fill="#50645a">平台默认模板</text><text x="778" y="216" font-size="14" fill="#50645a">无绑定时按默认配置</text><text x="778" y="240" font-size="14" fill="#50645a">不扩大模型权限</text>
<text x="28" y="311" font-size="14" fill="#50645a">选中的模板整体替换上级模板，字段不合并；项目和账号没有独立的路由模板绑定。</text>
</g></svg>
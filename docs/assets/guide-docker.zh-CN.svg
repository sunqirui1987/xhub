<title id="title">Docker 部署：访问入口与数据存储</title><desc id="desc">浏览器进入控制台；应用调用网关；网关连接上游供应商和内部数据服务。；示意图不表示应用必须经过控制台；应用直接连接网关，Redis 默认不发布主机端口。</desc>

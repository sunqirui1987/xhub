<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">Model access: inherit or narrow the parent scope</title><desc id="desc">Example: the team allows chat-a and chat-b; its project allows only chat-a.；An empty list adds no restriction / inherits. Block a team to stop access. Budgets do not reserve request costs.</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">Model access: inherit or narrow the parent scope</text>
<text x="28" y="70" font-size="14" fill="#50645a">Example: the team allows chat-a and chat-b; its project allows only chat-a.</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">Organization</text><text x="46" y="192" font-size="14" fill="#50645a">Group teams and costs</text><text x="46" y="216" font-size="14" fill="#50645a">Separate admin role</text><text x="46" y="240" font-size="14" fill="#50645a">Not an individual owner</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">Team</text><text x="290" y="192" font-size="14" fill="#50645a">Shared access boundary</text><text x="290" y="216" font-size="14" fill="#50645a">Allows chat-a / chat-b</text><text x="290" y="240" font-size="14" fill="#50645a">Membership for inference</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">Project (optional)</text><text x="534" y="192" font-size="14" fill="#50645a">Application / cost center</text><text x="534" y="216" font-size="14" fill="#50645a">Narrow scope to chat-a</text><text x="534" y="240" font-size="14" fill="#50645a">Budget within team budget</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">Virtual key</text><text x="778" y="192" font-size="14" fill="#50645a">Inherits parent scope</text><text x="778" y="216" font-size="14" fill="#50645a">Can only use chat-a</text><text x="778" y="240" font-size="14" fill="#50645a">Cannot restore chat-b</text>
<text x="28" y="311" font-size="14" fill="#50645a">An empty list adds no restriction / inherits. Block a team to stop access. Budgets do not reserve request costs.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">Routing templates: use the nearest assignment</title><desc id="desc">Resolve key → team → organization → platform; stop at the first selected template.；The selected template replaces its parent as a whole. No field merging; no project or account assignment.</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">Routing templates: use the nearest assignment</text>
<text x="28" y="70" font-size="14" fill="#50645a">Resolve key → team → organization → platform; stop at the first selected template.</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">Virtual key</text><text x="46" y="192" font-size="14" fill="#50645a">Selected? Use it</text><text x="46" y="216" font-size="14" fill="#50645a">Otherwise check team</text><text x="46" y="240" font-size="14" fill="#50645a">App-specific selection</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">Team</text><text x="290" y="192" font-size="14" fill="#50645a">Selected? Use it</text><text x="290" y="216" font-size="14" fill="#50645a">Otherwise check org</text><text x="290" y="240" font-size="14" fill="#50645a">Shared team selection</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">Organization</text><text x="534" y="192" font-size="14" fill="#50645a">Selected? Use it</text><text x="534" y="216" font-size="14" fill="#50645a">Otherwise check platform</text><text x="534" y="240" font-size="14" fill="#50645a">Organization selection</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">Platform</text><text x="778" y="192" font-size="14" fill="#50645a">Platform default template</text><text x="778" y="216" font-size="14" fill="#50645a">Or default configuration</text><text x="778" y="240" font-size="14" fill="#50645a">Never expands access</text>
<text x="28" y="311" font-size="14" fill="#50645a">The selected template replaces its parent as a whole. No field merging; no project or account assignment.</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">访问范围：越往下，只能继承或收窄</title><desc id="desc">示例团队允许 chat-a 和 chat-b；项目仅保留 chat-a。；空模型列表表示该层不施加限制 / 继承；停止团队访问使用封禁。预算不预占并发请求费用。</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">访问范围：越往下，只能继承或收窄</text>
<text x="28" y="70" font-size="14" fill="#50645a">示例团队允许 chat-a 和 chat-b；项目仅保留 chat-a。</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">组织</text><text x="46" y="192" font-size="14" fill="#50645a">归集团队与费用</text><text x="46" y="216" font-size="14" fill="#50645a">组织角色单独授权</text><text x="46" y="240" font-size="14" fill="#50645a">不是密钥所属的用户</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">团队</text><text x="290" y="192" font-size="14" fill="#50645a">共享访问边界</text><text x="290" y="216" font-size="14" fill="#50645a">允许 chat-a、chat-b</text><text x="290" y="240" font-size="14" fill="#50645a">团队成员获得推理范围</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">项目（可选）</text><text x="534" y="192" font-size="14" fill="#50645a">区分应用或成本中心</text><text x="534" y="216" font-size="14" fill="#50645a">收窄为 chat-a</text><text x="534" y="240" font-size="14" fill="#50645a">预算不超过团队预算</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">虚拟密钥</text><text x="778" y="192" font-size="14" fill="#50645a">继承父级模型范围</text><text x="778" y="216" font-size="14" fill="#50645a">只能使用 chat-a</text><text x="778" y="240" font-size="14" fill="#50645a">不能重新授权 chat-b</text>
<text x="28" y="311" font-size="14" fill="#50645a">空模型列表表示该层不施加限制 / 继承；停止团队访问使用封禁。预算不预占并发请求费用。</text>
</g></svg>
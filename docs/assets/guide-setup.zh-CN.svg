<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 344" role="img" aria-labelledby="title desc">
<title id="title">第一次配置：从模型接入到业务调用</title><desc id="desc">按顺序完成配置；每一步都为下一步准备访问条件。；平台管理权限不等于推理权限；个人推理还需要团队成员关系。</desc>
<rect width="1004" height="344" rx="18" fill="#f2f7f0"/>
<g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif" fill="#193d2f">
<text x="28" y="40" font-size="23" font-weight="700">第一次配置：从模型接入到业务调用</text>
<text x="28" y="70" font-size="14" fill="#50645a">按顺序完成配置；每一步都为下一步准备访问条件。</text>
<rect x="28" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="46" y="133" font-size="12" fill="#146b50">01</text><text x="46" y="162" font-size="18" font-weight="700">接入模型</text><text x="46" y="192" font-size="14" fill="#50645a">供应商凭证</text><text x="46" y="216" font-size="14" fill="#50645a">部署与公开模型名</text><text x="46" y="240" font-size="14" fill="#50645a">Models + Endpoints</text><path d="M248 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="272" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="290" y="133" font-size="12" fill="#146b50">02</text><text x="290" y="162" font-size="18" font-weight="700">配置工作空间</text><text x="290" y="192" font-size="14" fill="#50645a">组织、团队与成员</text><text x="290" y="216" font-size="14" fill="#50645a">模型范围和预算</text><text x="290" y="240" font-size="14" fill="#50645a">项目按需创建</text><path d="M492 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="516" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="534" y="133" font-size="12" fill="#146b50">03</text><text x="534" y="162" font-size="18" font-weight="700">发放虚拟密钥</text><text x="534" y="192" font-size="14" fill="#50645a">个人调试：个人密钥</text><text x="534" y="216" font-size="14" fill="#50645a">共享应用：服务密钥</text><text x="534" y="240" font-size="14" fill="#50645a">继承并收窄访问范围</text><path d="M736 189h18m-6-6 6 6-6 6" fill="none" stroke="#146b50" stroke-width="2"/><rect x="760" y="104" width="216" height="170" rx="14" fill="white" stroke="#ccdccf"/><text x="778" y="133" font-size="12" fill="#146b50">04</text><text x="778" y="162" font-size="18" font-weight="700">调用与核对</text><text x="778" y="192" font-size="14" fill="#50645a">Playground → 应用</text><text x="778" y="216" font-size="14" fill="#50645a">Usage 查看用量费用</text><text x="778" y="240" font-size="14" fill="#50645a">Logs 定位单次请求</text>
<text x="28" y="311" font-size="14" fill="#50645a">平台管理权限不等于推理权限；个人推理还需要团队成员关系。</text>
</g></svg>
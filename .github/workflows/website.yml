name: XHub Website

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "frontend/src/components/docs/**", "frontend/src/i18n/messages/docs*.ts", "internal/**/*.md", "cmd/regression/**/*.md", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "docs/**", "frontend/src/components/docs/**", "frontend/src/i18n/messages/docs*.ts", "internal/**/*.md", "cmd/regression/**/*.md", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:e2e
        working-directory: website
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-test-results
          path: website/test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
